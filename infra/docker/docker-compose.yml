version: '3.8'

networks:
  researcher-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  artifacts:

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: researcher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: researcher_agent
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    networks:
      - researcher-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: researcher-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - researcher-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: researcher-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - researcher-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ARXIV FETCHER (Scheduler)
  arxiv-fetcher:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker
    container_name: researcher-arxiv-fetcher
    restart: unless-stopped
    command: python -m src.main scheduler --interval 30
    environment:
      - DB_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
      - ARTIFACTS_BASE_DIR=/app/artifacts
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - researcher-net

  # PAPER TRIAGE WORKER
  paper-triage:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker
    container_name: researcher-paper-triage
    restart: unless-stopped
    command: python -m src.main worker triage
    environment:
      - DB_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
      - ARTIFACTS_BASE_DIR=/app/artifacts
      - CUSTOM_LLM_BASE_URL=${CUSTOM_LLM_BASE_URL}
      - CUSTOM_LLM_API_KEY=${CUSTOM_LLM_API_KEY}
      - CUSTOM_LLM_MODEL=${CUSTOM_LLM_MODEL}
      - CUSTOM_LLM_TRIAGE_BASE_URL=${CUSTOM_LLM_TRIAGE_BASE_URL}
      - CUSTOM_LLM_TRIAGE_API_KEY=${CUSTOM_LLM_TRIAGE_API_KEY}
      - CUSTOM_LLM_TRIAGE_MODEL=${CUSTOM_LLM_TRIAGE_MODEL}
      - CUSTOM_LLM_TRIAGE_MAX_RETRIES=${CUSTOM_LLM_TRIAGE_MAX_RETRIES}
      - CUSTOM_LLM_TRIAGE_TIMEOUT_SECONDS=${CUSTOM_LLM_TRIAGE_TIMEOUT_SECONDS}
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - researcher-net

  # PDF PARSER WORKER
  pdf-parser:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker
    container_name: researcher-pdf-parser
    restart: unless-stopped
    command: python -m src.main worker pdf_parser
    environment:
      - DB_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
      - ARTIFACTS_BASE_DIR=/app/artifacts
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - researcher-net

  # CONCEPT GENERATOR WORKER
  concept-generator:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker
    container_name: researcher-concept-generator
    restart: unless-stopped
    command: python -m src.main worker concept_gen
    environment:
      - DB_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
      - ARTIFACTS_BASE_DIR=/app/artifacts
      - CUSTOM_LLM_BASE_URL=${CUSTOM_LLM_BASE_URL}
      - CUSTOM_LLM_API_KEY=${CUSTOM_LLM_API_KEY}
      - CUSTOM_LLM_MODEL=${CUSTOM_LLM_MODEL}
      - CUSTOM_LLM_CONCEPT_GEN_BASE_URL=${CUSTOM_LLM_CONCEPT_GEN_BASE_URL}
      - CUSTOM_LLM_CONCEPT_GEN_API_KEY=${CUSTOM_LLM_CONCEPT_GEN_API_KEY}
      - CUSTOM_LLM_CONCEPT_GEN_MODEL=${CUSTOM_LLM_CONCEPT_GEN_MODEL}
      - CUSTOM_LLM_CONCEPT_GEN_MAX_RETRIES=${CUSTOM_LLM_CONCEPT_GEN_MAX_RETRIES}
      - CUSTOM_LLM_CONCEPT_GEN_TIMEOUT_SECONDS=${CUSTOM_LLM_CONCEPT_GEN_TIMEOUT_SECONDS}
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - researcher-net

  # EXPERIMENT EXPLODER WORKER
  experiment-exploder:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker
    container_name: researcher-experiment-exploder
    restart: unless-stopped
    command: python -m src.main worker experiment_exploder
    environment:
      - DB_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
      - ARTIFACTS_BASE_DIR=/app/artifacts
      - CUSTOM_LLM_BASE_URL=${CUSTOM_LLM_BASE_URL}
      - CUSTOM_LLM_API_KEY=${CUSTOM_LLM_API_KEY}
      - CUSTOM_LLM_MODEL=${CUSTOM_LLM_MODEL}
      - CUSTOM_LLM_EXPERIMENT_EXPLODER_BASE_URL=${CUSTOM_LLM_EXPERIMENT_EXPLODER_BASE_URL}
      - CUSTOM_LLM_EXPERIMENT_EXPLODER_API_KEY=${CUSTOM_LLM_EXPERIMENT_EXPLODER_API_KEY}
      - CUSTOM_LLM_EXPERIMENT_EXPLODER_MODEL=${CUSTOM_LLM_EXPERIMENT_EXPLODER_MODEL}
      - CUSTOM_LLM_EXPERIMENT_EXPLODER_MAX_RETRIES=${CUSTOM_LLM_EXPERIMENT_EXPLODER_MAX_RETRIES}
      - CUSTOM_LLM_EXPERIMENT_EXPLODER_TIMEOUT_SECONDS=${CUSTOM_LLM_EXPERIMENT_EXPLODER_TIMEOUT_SECONDS}
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - researcher-net

  # NOTIFIER WORKER
  notifier:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker
    container_name: researcher-notifier
    restart: unless-stopped
    command: python -m src.main worker notifier
    environment:
      - DB_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_CHANNEL=${SLACK_CHANNEL}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - researcher-net
